name: OpenSim-next Windows ReleaseOS Build

on:
  push:
    branches:
      - "opensim-next/integration"
    paths:
      - ".github/workflows/opensim-next-windows.yml"
      - "indra/**"
      - "autobuild.xml"
      - "CMakeLists.txt"
      - "requirements.txt"
      - "scripts/**"
      - "build.sh"
      - "build.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensim-next-releaseos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Windows x64 / ReleaseOS
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}\build-variables\variables
      PYTHON: python
    steps:
      - name: Checkout OpenSim-next Firestorm source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.1.2"

      - name: Install NSIS installer compiler
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Python build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install "autobuild>=3.8"

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          cmake --version
          git --version
          autobuild --version
          if (-not (Test-Path $env:AUTOBUILD_VARIABLES_FILE)) {
            throw "Firestorm build variables file not found: $env:AUTOBUILD_VARIABLES_FILE"
          }

      - name: Configure OpenSim-enabled viewer
        shell: cmd
        run: autobuild configure -A 64 -c ReleaseOS -- --package --chan OpenSimNext -DLL_TESTS:BOOL=FALSE

      - name: Build OpenSim-enabled viewer
        shell: cmd
        run: autobuild build -A 64 -c ReleaseOS --no-configure

      - name: Collect build diagnostics
        if: always()
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Out-File build-diagnostics.txt
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Out-File build-diagnostics.txt -Append
          cmake --version 2>&1 | Out-File build-diagnostics.txt -Append
          python --version 2>&1 | Out-File build-diagnostics.txt -Append
          Get-ChildItem -Directory -Filter "build-*" | ForEach-Object {
            $_.FullName | Out-File build-diagnostics.txt -Append
            Get-ChildItem $_.FullName -Recurse -Include CMakeCache.txt,*.log -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Out-File build-diagnostics.txt -Append
          }

      - name: Stage Windows distribution and installer
        if: success()
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "build-vc170-64\newview"
          if (-not (Test-Path $source)) {
            throw "Expected Firestorm distribution directory not found: $source"
          }
          $stage = Join-Path $env:GITHUB_WORKSPACE "opensim-next-distribution"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Get-ChildItem $source -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll", ".dat", ".ini", ".xml", ".json", ".db", ".pak", ".bin", ".txt", ".crt") } |
            ForEach-Object {
              $relative = $_.FullName.Substring($source.Length).TrimStart('\')
              $target = Join-Path $stage $relative
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Copy-Item $_.FullName $target -Force
            }
          $installer = Get-ChildItem $source -Recurse -File -Filter "*Setup*.exe"
          if (-not $installer) {
            $installer = Get-ChildItem $source -Recurse -File -Filter "*.exe" |
              Where-Object { $_.Name -match "OpenSimNext|Firestorm" }
          }
          if ($installer) {
            New-Item -ItemType Directory -Force -Path (Join-Path $stage "installer") | Out-Null
            $installer | Copy-Item -Destination (Join-Path $stage "installer") -Force
          }
          if (-not (Get-ChildItem $stage -Recurse -File -Filter "*.exe")) {
            throw "No executable files found in staged viewer distribution."
          }

      - name: Upload Windows viewer distribution and installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimNext-Windows-x64-ReleaseOS
          path: opensim-next-distribution/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimNext-Windows-ReleaseOS-diagnostics
          path: |
            build-diagnostics.txt
            build-windows-x64/CMakeCache.txt
            build-windows-x64/**/*.log
          if-no-files-found: warn
          retention-days: 14
