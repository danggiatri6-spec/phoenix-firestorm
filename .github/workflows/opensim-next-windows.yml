name: OpenSim-next Windows ReleaseOS Build

on:
  push:
    branches:
      - "opensim-next/integration"
    paths:
      - ".github/workflows/opensim-next-windows.yml"
      - "indra/**"
      - "autobuild.xml"
      - "CMakeLists.txt"
      - "requirements.txt"
      - "scripts/**"
      - "build.sh"
      - "build.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensim-next-releaseos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 / ReleaseOS
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}\build-variables\variables
      PYTHON: python
    steps:
      - name: Checkout OpenSim-next Firestorm source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.1.2"

      - name: Install NSIS installer compiler
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install Python build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install "autobuild>=3.8"
          python -m pip install "opencc-python-reimplemented==0.1.7"

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          cmake --version
          git --version
          autobuild --version
          if (-not (Test-Path $env:AUTOBUILD_VARIABLES_FILE)) {
            throw "Firestorm build variables file not found: $env:AUTOBUILD_VARIABLES_FILE"
          }

      - name: Generate Simplified Chinese Viewer translations
        shell: pwsh
        run: python indra/newview/generate_simplified_chinese.py

      - name: Configure OpenSim-enabled viewer
        shell: cmd
        run: autobuild configure -A 64 -c ReleaseOS -- -DOPENSIM:BOOL=ON -DPACKAGE:BOOL=ON -DVIEWER_CHANNEL:STRING=OpenSimNext -DUSE_VELOPACK:BOOL=OFF -DLL_TESTS:BOOL=FALSE

      - name: Build OpenSim-enabled viewer
        shell: cmd
        run: autobuild build -A 64 -c ReleaseOS --no-configure

      - name: Collect build diagnostics
        if: always()
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Out-File build-diagnostics.txt
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Out-File build-diagnostics.txt -Append
          cmake --version 2>&1 | Out-File build-diagnostics.txt -Append
          python --version 2>&1 | Out-File build-diagnostics.txt -Append
          Get-ChildItem -Directory -Filter "build-*" | ForEach-Object {
            $_.FullName | Out-File build-diagnostics.txt -Append
            Get-ChildItem $_.FullName -Recurse -Include CMakeCache.txt,*.log -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Out-File build-diagnostics.txt -Append
          }

      - name: Stage Windows distribution and installer
        if: success()
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "build-vc170-64\newview\Release"
          if (-not (Test-Path $source)) {
            throw "Expected packaged viewer directory not found: $source"
          }
          $stage = Join-Path $env:GITHUB_WORKSPACE "opensim-next-distribution"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item (Join-Path $source "*") $stage -Recurse -Force
          $installer = Get-ChildItem $stage -Recurse -File -Filter "*_Setup.exe"
          if (-not $installer) {
            throw "NSIS setup executable (*_Setup.exe) was not generated."
          }

          # The Firestorm manifest renames firestorm-bin.exe to the exact
          # executable recorded in build_data.json. Never accept an arbitrary
          # plugin/helper EXE as the viewer.
          $buildData = Get-ChildItem $stage -Recurse -File -Filter "build_data.json" |
            Select-Object -First 1
          if (-not $buildData) {
            throw "build_data.json missing from packaged distribution."
          }
          $metadata = Get-Content $buildData.FullName -Raw | ConvertFrom-Json
          $executableName = [string]$metadata.Executable
          if ([string]::IsNullOrWhiteSpace($executableName)) {
            throw "build_data.json does not declare the Viewer Executable."
          }
          $viewer = Join-Path $buildData.DirectoryName $executableName
          if (-not (Test-Path $viewer -PathType Leaf)) {
            throw "Viewer executable declared by build_data.json not found: $viewer"
          }

          # Verify the OpenSim-specific voice stack and Chromium media plugin
          # that the Firestorm Windows manifest is expected to stage.
          $requiredFiles = @(
            "slplugin.exe",
            "SLVoice.exe",
            "vivoxsdk_x64.dll",
            "ortp_x64.dll",
            "llplugin\\media_plugin_cef.dll",
            "llplugin\\libcef.dll",
            "llplugin\\dullahan_host.exe"
          )
          foreach ($relativePath in $requiredFiles) {
            $candidate = Join-Path $stage $relativePath
            if (-not (Test-Path $candidate -PathType Leaf)) {
              throw "Required runtime file missing from packaged distribution: $relativePath"
            }
          }
          $portableRoot = Join-Path $env:GITHUB_WORKSPACE "opensim-next-portable"
          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Get-ChildItem $stage -Force |
            Where-Object { $_.Name -ne "installer" } |
            Copy-Item -Destination $portableRoot -Recurse -Force
          Get-ChildItem $portableRoot -Recurse -File -Filter "*_Setup.exe" |
            Remove-Item -Force
          Compress-Archive -Path (Join-Path $portableRoot "*") -DestinationPath (Join-Path $env:GITHUB_WORKSPACE "OpenSimNext-Windows-x64-Portable.zip") -CompressionLevel Optimal
      - name: Upload Windows viewer distribution and installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimNext-Windows-x64-ReleaseOS
          path: |
            opensim-next-distribution/**
            OpenSimNext-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimNext-Windows-ReleaseOS-diagnostics
          path: |
            build-diagnostics.txt
            build-vc170-64/CMakeCache.txt
            build-vc170-64/**/*.log
          if-no-files-found: warn
          retention-days: 14
