name: OpenSim-next Windows Build Validation

on:
  push:
    branches:
      - "opensim-next/integration"
      - "opensim-next/avatar-interaction-actions"
    paths:
      - ".github/workflows/opensim-next-windows-ci.yml"
      - "indra/**"
      - "autobuild.xml"
      - "CMakeLists.txt"
      - "requirements.txt"
      - "scripts/**"
      - "build.sh"
      - "build.bat"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opensim-next-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64 / Compile Validation
    runs-on: windows-2022
    timeout-minutes: 360
    env:
      AUTOBUILD_VSVER: "170"
      AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}\build-variables\variables
      PYTHON: python
    steps:
      - name: Checkout OpenSim-next Firestorm source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout Firestorm build variables
        uses: actions/checkout@v4
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~4.1.2"

      - name: Install Python build requirements
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements.txt
          python -m pip install "autobuild>=3.8"
          python -m pip install "opencc-python-reimplemented==0.1.7"

      - name: Verify toolchain
        shell: pwsh
        run: |
          python --version
          cmake --version
          git --version
          autobuild --version
          if (-not (Test-Path $env:AUTOBUILD_VARIABLES_FILE)) {
            throw "Firestorm build variables file not found: $env:AUTOBUILD_VARIABLES_FILE"
          }

      - name: Generate Simplified Chinese Viewer translations
        shell: pwsh
        run: python indra/newview/generate_simplified_chinese.py

      - name: Configure OpenSim-enabled viewer with runtime packaging
        shell: cmd
        run: autobuild configure -A 64 -c ReleaseOS -- -DOPENSIM:BOOL=ON -DPACKAGE:BOOL=ON -DVIEWER_CHANNEL:STRING=OpenSimNext -DUSE_VELOPACK:BOOL=OFF -DLL_TESTS:BOOL=FALSE -DOPENSIMNEXT_ENABLE_WHISPER_CPP:BOOL=ON

      - name: Build OpenSim-enabled viewer and runtime package
        shell: cmd
        run: autobuild build -A 64 -c ReleaseOS --no-configure

      - name: Validate and package portable Windows x64 Viewer
        shell: pwsh
        run: |
          $viewerDir = Join-Path $env:GITHUB_WORKSPACE "build-vc170-64/newview/Release"
          $requiredPaths = @(
            "firestorm-bin.exe",
            "app_settings/settings.xml",
            "app_settings/shaders",
            "character",
            "skins/skins.xml",
            "llplugin/media_plugin_cef.dll",
            "slplugin.exe"
          )
          $missing = @()
          foreach ($relativePath in $requiredPaths) {
            if (-not (Test-Path (Join-Path $viewerDir $relativePath))) {
              $missing += $relativePath
            }
          }
          if ($missing.Count -gt 0) {
            throw "Viewer runtime package is incomplete. Missing required files/directories: $($missing -join ', '). PACKAGE must remain enabled so viewer_manifest.py stages the full runtime."
          }

          @(
            "OpenSim-next Windows x64 portable test build"
            "Commit: $env:GITHUB_SHA"
            "Configuration: ReleaseOS"
            "Runtime files staged by viewer_manifest.py with PACKAGE=ON."
            "This is an unsigned CI test package, not a production installer."
            "Whisper.cpp is built into this configuration; provide a compatible external GGML model file in the Viewer UI."
          ) | Set-Content (Join-Path $viewerDir "OPENSIMNEXT-TEST-BUILD.txt")
          $zipPath = Join-Path $env:GITHUB_WORKSPACE "OpenSimNext-Windows-x64-Portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $viewerDir "*") -DestinationPath $zipPath -CompressionLevel Optimal
          Write-Host "Created validated portable package: $zipPath"
          Get-Item $zipPath | Format-List FullName,Length

      - name: Upload portable Windows x64 Viewer
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimNext-Windows-x64-Portable
          path: OpenSimNext-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Collect build diagnostics
        if: always()
        shell: pwsh
        run: |
          "Commit: $env:GITHUB_SHA" | Out-File build-diagnostics.txt
          "Runner: $env:RUNNER_OS / $env:RUNNER_ARCH" | Out-File build-diagnostics.txt -Append
          cmake --version 2>&1 | Out-File build-diagnostics.txt -Append
          python --version 2>&1 | Out-File build-diagnostics.txt -Append
          Get-ChildItem -Directory -Filter "build-*" | ForEach-Object {
            $_.FullName | Out-File build-diagnostics.txt -Append
            Get-ChildItem $_.FullName -Recurse -Include CMakeCache.txt,*.log -ErrorAction SilentlyContinue |
              Select-Object -ExpandProperty FullName |
              Out-File build-diagnostics.txt -Append
          }

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenSimNext-Windows-Compile-diagnostics
          path: |
            build-diagnostics.txt
            build-vc170-64/CMakeCache.txt
            build-vc170-64/**/*.log
          if-no-files-found: warn
          retention-days: 7
